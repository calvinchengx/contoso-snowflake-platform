name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Repo tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: snowflake-platform-tasks
    steps:
      - uses: actions/checkout@v7
        with:
          path: snowflake-platform-tasks
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-data-product
          path: contoso-data-product
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/snowflake-emulator
          path: snowflake-emulator
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: matrix.os == 'windows-latest'
        run: choco install make --no-progress -y
        working-directory: ${{ github.workspace }}
      - run: uv sync --frozen --group dev
      - run: make help
      - run: make lint
      - run: make test
      # ruff was configured in pyproject.toml and never run, so the config
      # described an intention rather than a guarantee.
      - name: ruff
        run: uvx ruff@0.15.22 check .
